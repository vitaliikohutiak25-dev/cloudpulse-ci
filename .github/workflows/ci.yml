name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint code with Pylint
        run: |
          pylint --fail-under=8.5 app/main.py

      - name: Build check (compile bytecode)
        run: |
          python -m compileall app/

      - name: Run automated tests with Pytest
        run: |
          python -m pytest -v

  package-artifact:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create release ZIP archive
        run: |
          zip -r cloudpulse-release.zip app/ requirements.txt README.md

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: cloudpulse-app-artifact
          path: cloudpulse-release.zip
